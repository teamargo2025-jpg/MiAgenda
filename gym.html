<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>Gym — MiAgenda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="gym">
    <main id="app">
      <header class="barra">
        <h1>Gym</h1>
        <button id="reiniciar" type="button" class="salir">Reiniciar</button>
      </header>

      <!-- La semana entera a la vista: elegir día es de un toque y se ve de
           un vistazo qué toca hoy sin abrir nada. -->
      <nav class="semana" id="semana" aria-label="Día de la semana"></nav>

      <section class="panel" id="panel-rutina">
        <div class="cabecera-seccion">
          <h2 id="titulo-rutina">Rutina</h2>
          <button id="editar-rutina" type="button" class="salir">Editar</button>
        </div>
        <div id="rutina-vista"></div>
        <p id="rutina-aviso" class="resultado"></p>
      </section>

      <!-- El cronómetro ocupa la pantalla porque es lo que se mira de reojo,
           sudando, a metro y medio del suelo mientras el celular está apoyado
           en el banco. -->
      <section class="crono" id="crono" data-estado="parado">
        <span class="crono-etiqueta" id="crono-etiqueta">Descanso</span>
        <strong class="crono-cifra" id="crono-cifra">0:00</strong>
        <div class="crono-botones">
          <button id="crono-accion" type="button">Empezar descanso</button>
        </div>
      </section>

      <section class="panel">
        <h2>Cuánto descanso</h2>
        <div class="chips" role="group" aria-label="Duración del descanso">
          <button type="button" class="chip" data-segundos="60">1:00</button>
          <button type="button" class="chip" data-segundos="90" aria-pressed="true">1:30</button>
          <button type="button" class="chip" data-segundos="120">2:00</button>
          <button type="button" class="chip" data-segundos="180">3:00</button>
          <button type="button" class="chip" data-segundos="300">5:00</button>
        </div>
      </section>

      <section class="panel">
        <h2>Series de hoy</h2>
        <div class="contador">
          <button id="menos" type="button" aria-label="Quitar una serie">−</button>
          <strong id="series">0</strong>
          <button id="mas" type="button" aria-label="Añadir una serie">+</button>
        </div>
        <p id="lectura-series" class="lectura"></p>
      </section>

      <p class="nota">
        Ejercicios con peso y repeticiones, e historial de sesiones, llegarán
        después.
      </p>
    </main>

    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Inicio</span>
      </a>
      <a href="/capturar.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/finanzas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Finanzas</span>
      </a>
      <a href="/gym.html" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9.5v5"/><path d="M20.5 9.5v5"/><path d="M6.5 12h11"/></svg>
        <span>Gym</span>
      </a>
    </nav>

    <script type="module" src="/src/gym.js"></script>
  </body>
</html>
