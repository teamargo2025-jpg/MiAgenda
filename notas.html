<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>Mis notas — MiAgenda</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="notas">
    <main id="app">
      <header class="barra">
        <h1>Mis notas</h1>
        <div class="acciones-barra">
          <!-- El diagnóstico es donde se suscribe un dispositivo nuevo a las
               notificaciones. No estorba en la captura, pero tiene que ser
               alcanzable sin escribir la URL a mano. -->
          <a class="enlace-discreto" href="/diagnostico.html">Ajustes</a>
          <button id="salir" type="button" class="salir">Salir</button>
        </div>
      </header>

      <!-- Las pestañas se generan desde las notas: no hay lista de temas que
           mantener, así que un tema vacío desaparece solo. -->
      <nav id="temas" class="chips temas" hidden aria-label="Filtrar por tema"></nav>

      <p id="estado" class="resultado">Cargando…</p>

      <section id="seccion-pendientes" hidden>
        <h2>Pendientes</h2>
        <ul id="pendientes" class="notas-lista"></ul>
      </section>

      <section id="seccion-hechas" hidden>
        <div class="cabecera-seccion">
          <h2>Hechas</h2>
          <button id="vaciar-hechas" type="button" class="salir" hidden>Borrar</button>
        </div>
        <ul id="hechas" class="notas-lista"></ul>
      </section>

      <p id="vacio" hidden class="nota">
        Todavía no hay nada. <a href="/">Captura algo</a>.
      </p>
    </main>

    <!-- Barra fija abajo: en el celular es donde llega el pulgar sin recolocar
         la mano. Los enlaces en el pie obligaban a estirarse hasta arriba o a
         hacer scroll, que para moverse entre tres pantallas es demasiado. -->
    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Inicio</span>
      </a>
      <a href="/capturar.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/finanzas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Finanzas</span>
      </a>
      <a href="/gym.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9.5v5"/><path d="M20.5 9.5v5"/><path d="M6.5 12h11"/></svg>
        <span>Gym</span>
      </a>
    </nav>


    <!-- El aviso de borrado vive fuera de la lista para que no se vaya con la
         fila que acaba de desaparecer. -->
    <div id="deshacer" class="deshacer" hidden>
      <span id="deshacer-texto"></span>
      <button id="deshacer-boton" type="button">Deshacer</button>
    </div>

    <script type="module" src="/src/notas.js"></script>
  </body>
</html>
