<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Suelto una idea y no se pierde." />
    <title>MiAgenda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="captura">
    <main id="app">
      <!-- Mientras hay un tema activo, todo lo que se escriba cae ahí sin
           repetir la etiqueta. Se ve siempre, porque un contexto invisible que
           decide dónde van tus notas sería peor que no tenerlo. -->
      <div id="banda-tema" class="banda-tema" hidden>
        <span id="banda-tema-nombre"></span>
        <button id="banda-tema-salir" type="button" aria-label="Salir del tema">Salir</button>
      </div>

      <form id="form" autocomplete="off">
        <!-- Sin etiqueta, sin categorías, sin desplegables: el peaje de treinta
             segundos es justo lo que este proyecto viene a eliminar. -->
        <!-- El micrófono va pegado al campo, no en una barra aparte: hablar y
             escribir son la misma acción con distinta entrada, y separarlos
             obligaría a decidir cuál usar antes de empezar. -->
        <div class="campo-con-voz">
          <textarea
            id="texto"
            rows="4"
            placeholder="¿Qué se te ocurrió?"
            autofocus
            enterkeyhint="done"
          ></textarea>
          <button id="microfono" type="button" class="microfono" hidden aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
            <span class="visualmente-oculto">Dictar</span>
          </button>
        </div>
        <!-- Confirma el tema detectado mientras escribes. Sin esto, escribir
             "#salud" y ver que la etiqueta desaparece al guardar parecería que
             se perdió algo. -->
        <p id="tema" class="tema-detectado" hidden></p>

        <!-- El formato solo aparece cuando la nota tiene más de una línea:
             para una frase suelta no significa nada, y mostrarlo siempre sería
             añadir una decisión a la captura de dos segundos. -->
        <div id="formato" class="chips" hidden role="group" aria-label="Formato de la nota">
          <button type="button" class="chip" data-formato="texto" aria-pressed="true">Texto</button>
          <button type="button" class="chip" data-formato="lista" aria-pressed="false">Lista</button>
          <button type="button" class="chip" data-formato="checklist" aria-pressed="false">Checklist</button>
        </div>

        <!-- Atajos para los casos de siempre. Elegir día y hora en un
             calendario son cinco toques; esto es uno. La fecha libre queda
             detrás de "Otra…" para quien de verdad la necesite. -->
        <div id="cuando" class="chips" role="group" aria-label="¿Cuándo recordarlo?">
          <button type="button" class="chip" data-preset="tarde">Esta tarde</button>
          <button type="button" class="chip" data-preset="noche">Esta noche</button>
          <button type="button" class="chip" data-preset="manana">Mañana 9:00</button>
          <button type="button" class="chip" data-preset="otra">Otra…</button>
        </div>

        <input id="fecha-libre" type="datetime-local" hidden aria-label="Fecha y hora" />

        <button id="guardar" type="submit">Guardar</button>
      </form>

      <p id="aviso" class="resultado"></p>

      <section id="recientes" hidden>
        <h2>Últimas</h2>
        <ul id="lista"></ul>
      </section>
    </main>

    <!-- Barra fija abajo: en el celular es donde llega el pulgar sin recolocar
         la mano. Los enlaces en el pie obligaban a estirarse hasta arriba o a
         hacer scroll, que para moverse entre tres pantallas es demasiado. -->
    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/gastos.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Gastos</span>
      </a>
    </nav>

    <script type="module" src="/src/captura.js"></script>
  </body>
</html>
