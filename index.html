<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Suelto una idea y no se pierde." />
    <title>MiAgenda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="inicio">
    <main id="app">
      <header class="saludo">
        <p id="momento" class="momento">Hola</p>
        <p id="fecha" class="fecha-larga"></p>
      </header>

      <!-- Capturar es lo que más se hace, así que es lo más grande de la
           pantalla. El lobby orienta antes de pedir nada, pero no puede
           esconder la acción por la que se abre la app. -->
      <a href="/capturar.html" class="boton-grande">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Anotar algo</span>
      </a>

      <p id="estado" class="resultado"></p>

      <section id="seccion-hoy" class="panel" hidden>
        <h2>Hoy</h2>
        <ul id="hoy" class="notas-lista compacta"></ul>
      </section>

      <section id="seccion-resumen" class="tarjetas" hidden>
        <a class="tarjeta" href="/notas.html">
          <span class="tarjeta-cifra" id="cifra-notas">—</span>
          <span class="tarjeta-etiqueta">pendientes</span>
        </a>
        <a class="tarjeta" href="/dinero.html">
          <span class="tarjeta-cifra" id="cifra-balance">—</span>
          <span class="tarjeta-etiqueta">este mes</span>
        </a>
      </section>

      <p id="sin-nada" class="nota" hidden>
        Todavía no hay nada aquí. Lo que anotes irá apareciendo.
      </p>
    </main>

    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Inicio</span>
      </a>
      <a href="/capturar.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/dinero.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Dinero</span>
      </a>
    </nav>

    <script type="module" src="/src/inicio.js"></script>
  </body>
</html>
