<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <meta name="description" content="Suelto una idea y no se pierde." />
    <title>MiAgenda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="captura">
    <main id="app">
      <form id="form" autocomplete="off">
        <!-- Sin etiqueta, sin categorías, sin desplegables: el peaje de treinta
             segundos es justo lo que este proyecto viene a eliminar. -->
        <textarea
          id="texto"
          rows="4"
          placeholder="¿Qué se te ocurrió?"
          autofocus
          enterkeyhint="done"
        ></textarea>
        <button id="guardar" type="submit">Guardar</button>
      </form>

      <p id="aviso" class="resultado"></p>

      <section id="recientes" hidden>
        <h2>Últimas</h2>
        <ul id="lista"></ul>
      </section>

      <footer>
        <a href="/diagnostico.html">Diagnóstico y notificaciones</a>
      </footer>
    </main>
    <script type="module" src="/src/captura.js"></script>
  </body>
</html>
