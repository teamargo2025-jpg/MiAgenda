<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <title>Gastos — MiAgenda</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="gastos">
    <main id="app">
      <header class="barra">
        <h1>Gastos</h1>
      </header>

      <!-- El total del mes va arriba: es el único número que hace útil apuntar
           gastos sin categorías. Verlo al abrir es la mitad del valor. -->
      <section class="total">
        <span class="total-etiqueta">Este mes</span>
        <strong id="total-mes">—</strong>
        <span id="total-detalle" class="total-detalle"></span>
      </section>

      <form id="form" autocomplete="off">
        <div class="fila-gasto">
          <div class="campo-monto">
            <span class="moneda">S/</span>
            <!-- inputmode decimal abre el teclado numérico en el celular sin
                 sufrir la rueda del scroll que trae type="number". -->
            <input
              id="monto"
              type="text"
              inputmode="decimal"
              placeholder="0.00"
              autofocus
              required
              aria-label="Monto"
            />
          </div>
          <input
            id="descripcion"
            type="text"
            placeholder="¿En qué?"
            required
            aria-label="Descripción"
          />
        </div>
        <button id="guardar" type="submit">Anotar gasto</button>
      </form>

      <p id="aviso" class="resultado"></p>

      <section id="seccion-lista" hidden>
        <h2>Últimos</h2>
        <ul id="lista" class="notas-lista"></ul>
      </section>

      <p id="vacio" hidden class="nota">Todavía no has anotado nada.</p>
    </main>

    <!-- Barra fija abajo: en el celular es donde llega el pulgar sin recolocar
         la mano. Los enlaces en el pie obligaban a estirarse hasta arriba o a
         hacer scroll, que para moverse entre tres pantallas es demasiado. -->
    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/gastos.html" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Gastos</span>
      </a>
    </nav>


    <div id="deshacer" class="deshacer" hidden>
      <span id="deshacer-texto"></span>
      <button id="deshacer-boton" type="button">Deshacer</button>
    </div>

    <script type="module" src="/src/gastos.js"></script>
  </body>
</html>
