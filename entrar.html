<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>Entrar — MiAgenda</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="captura">
    <main id="app">
      <h1>MiAgenda</h1>
      <p class="lead">Entra para ver tus notas.</p>

      <form id="form" autocomplete="on">
        <input
          id="correo"
          type="email"
          name="email"
          placeholder="Correo"
          autocomplete="username"
          required
        />
        <input
          id="clave"
          type="password"
          name="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        />
        <button id="entrar" type="submit">Entrar</button>
      </form>

      <p id="aviso" class="resultado"></p>
    </main>
    <script type="module" src="/src/entrar.js"></script>
  </body>
</html>
