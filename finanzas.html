<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebebeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <title>Finanzas — MiAgenda</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono-192.png" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="finanzas">
    <main id="app">
      <header class="barra">
        <h1>Finanzas</h1>
        <a class="enlace-discreto" href="/analisis.html">Análisis</a>
      </header>

      <!-- Tres cifras y no una: el balance a secas engaña, porque 200 de saldo
           significa cosas distintas si entraron 300 o 3000. -->
      <section class="balance">
        <div class="balance-principal">
          <span class="total-etiqueta">Balance del mes</span>
          <strong id="balance">—</strong>
        </div>
        <dl class="balance-detalle">
          <div>
            <dt>Entró</dt>
            <dd id="ingresos">—</dd>
          </div>
          <div>
            <dt>Salió</dt>
            <dd id="gastos">—</dd>
          </div>
        </dl>
      </section>

      <form id="form" autocomplete="off">
        <!-- El tipo va antes del monto porque cambia lo que significa la cifra
             que estás a punto de escribir. -->
        <div class="chips" role="group" aria-label="Tipo de movimiento">
          <button type="button" class="chip" data-tipo="gasto" aria-pressed="true">Gasto</button>
          <button type="button" class="chip" data-tipo="ingreso" aria-pressed="false">Ingreso</button>
        </div>

        <div class="fila-gasto">
          <div class="campo-monto">
            <span class="moneda">S/</span>
            <!-- inputmode decimal abre el teclado numérico en el celular sin
                 sufrir la rueda del scroll que trae type="number". -->
            <input
              id="monto"
              type="text"
              inputmode="decimal"
              placeholder="0.00"
              autofocus
              required
              aria-label="Monto"
            />
          </div>
          <input
            id="descripcion"
            type="text"
            placeholder="¿En qué? #categoría"
            required
            aria-label="Descripción"
          />
        </div>

        <p id="categoria-detectada" class="tema-detectado" hidden></p>

        <button id="guardar" type="submit">Anotar</button>
      </form>

      <p id="aviso" class="resultado"></p>

      <section id="seccion-lista" hidden>
        <h2>Últimos</h2>
        <ul id="lista" class="notas-lista"></ul>
      </section>

      <p id="vacio" hidden class="nota">Anota arriba tu primer gasto o ingreso.</p>
    </main>

    <nav class="barra-nav" aria-label="Secciones">
      <a href="/" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>Inicio</span>
      </a>
      <a href="/capturar.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Capturar</span>
      </a>
      <a href="/notas.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Notas</span>
      </a>
      <a href="/finanzas.html" class="pestana" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
        <span>Finanzas</span>
      </a>
      <a href="/gym.html" class="pestana">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3.5 9.5v5"/><path d="M20.5 9.5v5"/><path d="M6.5 12h11"/></svg>
        <span>Gym</span>
      </a>
    </nav>

    <div id="deshacer" class="deshacer" hidden>
      <span id="deshacer-texto"></span>
      <button id="deshacer-boton" type="button">Deshacer</button>
    </div>

    <script type="module" src="/src/finanzas.js"></script>
  </body>
</html>
